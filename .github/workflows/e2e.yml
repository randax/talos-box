name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kvm-substrate:
    name: KVM substrate e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Make /dev/kvm writable by the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU, EFI firmware, and NFS userland
        run: |
          sudo apt-get update
          # socat serves the guest-agent probe; nfs-ganesha serves the NFSv3
          # export in userspace so the lane never depends on the runner
          # kernel's nfsd.
          sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf xz-utils curl jq iptables socat nfs-ganesha nfs-ganesha-vfs rpcbind
          test -w /dev/kvm
      - name: Allow talosbox routed traffic
        run: |
          # Docker on the runner sets the FORWARD policy to DROP, which eats
          # guest egress once the bridge turns packets into routed traffic, so
          # the CI lane must allow traffic to leave br-tbx and permit return
          # flows back into the guests.
          if ! sudo iptables -C FORWARD -i 'br-tbx+' -j ACCEPT; then
            sudo iptables -I FORWARD 1 -i 'br-tbx+' -j ACCEPT
          fi
          if ! sudo iptables -C FORWARD -o 'br-tbx+' -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; then
            sudo iptables -I FORWARD 1 -o 'br-tbx+' -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: Build Linux binaries
        run: |
          mkdir -p bin
          go build -o bin/tbx ./cmd/tbx
          go build -o bin/tbxd ./cmd/tbxd
          go build -o bin/tbx-helper ./cmd/tbx-helper
      - name: Assert CI contract
        run: scripts/ci/test_linux_kvm_e2e_contract.sh
      - name: Verify KVM substrate-only cluster
        run: scripts/ci/linux-kvm-e2e.sh

  kvm-storage:
    name: KVM storage e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Make /dev/kvm writable by the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and EFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 qemu-utils ovmf xz-utils curl jq iptables
          test -w /dev/kvm
      - name: Allow talosbox routed traffic
        run: |
          # Docker on the runner sets the FORWARD policy to DROP, which eats
          # guest egress once the bridge turns packets into routed traffic, so
          # the CI lane must allow traffic to leave br-tbx and permit return
          # flows back into the guests.
          if ! sudo iptables -C FORWARD -i 'br-tbx+' -j ACCEPT; then
            sudo iptables -I FORWARD 1 -i 'br-tbx+' -j ACCEPT
          fi
          if ! sudo iptables -C FORWARD -o 'br-tbx+' -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; then
            sudo iptables -I FORWARD 1 -o 'br-tbx+' -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          fi
      - name: Build Linux binaries
        run: |
          mkdir -p bin
          go build -o bin/tbx ./cmd/tbx
          go build -o bin/tbxd ./cmd/tbxd
          go build -o bin/tbx-helper ./cmd/tbx-helper
      - name: Assert CI contract
        run: scripts/ci/test_linux_kvm_e2e_contract.sh
      - name: Verify provisioned storage cluster
        run: scripts/ci/linux-kvm-storage-e2e.sh
