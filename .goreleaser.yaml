# GoReleaser runs once, on a macOS runner: darwin/arm64 needs cgo for
# Virtualization.framework, while the Linux binaries are pure Go and
# cross-compile with CGO_ENABLED=0. One run means one release, one checksum
# file, and one brew formula that knows every platform.
#
# The darwin binaries are signed with the Developer ID identity and notarized
# (notarize.macos below) when the signing secrets are present; a local
# snapshot without them builds unsigned binaries, which is fine for rehearsal
# but not for running against Virtualization.framework.
version: 2
project_name: tbx

before:
  hooks:
    - go mod tidy

builds:
  - id: tbx-darwin
    main: ./cmd/tbx
    binary: tbx
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=1]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"
    hooks:
      # Go's external linker leaves an ad-hoc, linker-signed signature whose
      # load command is not last, which the Developer ID signer cannot replace;
      # strip it so the signature below is the only one.
      post: codesign --remove-signature {{ .Path }}
  - id: tbxd-darwin
    main: ./cmd/tbxd
    binary: tbxd
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=1]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"
    hooks:
      # Go's external linker leaves an ad-hoc, linker-signed signature whose
      # load command is not last, which the Developer ID signer cannot replace;
      # strip it so the signature below is the only one.
      post: codesign --remove-signature {{ .Path }}
  - id: tbx-helper-darwin
    main: ./cmd/tbx-helper
    binary: tbx-helper
    goos: [darwin]
    goarch: [arm64]
    env: [CGO_ENABLED=1]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"
    hooks:
      # Go's external linker leaves an ad-hoc, linker-signed signature whose
      # load command is not last, which the Developer ID signer cannot replace;
      # strip it so the signature below is the only one.
      post: codesign --remove-signature {{ .Path }}
  - id: tbx-linux
    main: ./cmd/tbx
    binary: tbx
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"
  - id: tbxd-linux
    main: ./cmd/tbxd
    binary: tbxd
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"
  - id: tbx-helper-linux
    main: ./cmd/tbx-helper
    binary: tbx-helper
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - "-X github.com/randax/talos-box/internal/version.Version={{ .Tag }}"

# Developer ID signing + notarization of the darwin binaries (#19, #26). The
# virtualization entitlement rides on the signature, as it did on the ad-hoc
# one. Enabled only when the certificate is in the environment, so a snapshot
# on a machine without the secrets still succeeds.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [tbx-darwin, tbxd-darwin, tbx-helper-darwin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        entitlements: build/entitlements.plist
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Apple's queue is slow for a new account and the three binaries are
        # submitted one after another; the first rehearsal timed out at 20m
        # with the submission still pending (v0.1.1-rc.1).
        wait: true
        timeout: 60m

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/linux.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: randax
    name: talos-box
  prerelease: auto
  draft: false

homebrew_casks:
  - name: tbx
    repository:
      owner: randax
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/randax/talos-box
    description: Talos Linux VM clusters on your laptop
    binaries: [tbx, tbxd, tbx-helper]
    commit_author:
      name: talos-box-release
      email: noreply@github.com
    # Prereleases publish to GitHub Releases only; the tap tracks stable tags.
    skip_upload: auto
    caveats: |
      Register the privileged networking helper once:
        sudo tbx system install
    hooks:
      post:
        # Ad-hoc signed, not notarized: strip quarantine so Gatekeeper lets the
        # entitled binaries run.
        install: |
          if OS.mac?
            ["tbx", "tbxd", "tbx-helper"].each do |bin|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{bin}"]
            end
          end
