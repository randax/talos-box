# The tbx-helper unit runs as the tbx user with only CAP_NET_ADMIN,
# CAP_NET_BIND_SERVICE and CAP_NET_RAW; without CAP_DAC_OVERRIDE it cannot
# write /proc/sys/net/ipv4/ip_forward itself. Bridges the helper creates
# inherit forwarding from this setting.
net.ipv4.ip_forward = 1
# Bridges the helper creates inherit this; a host that hardened it to 0 with
# ip_forward already 1 would otherwise leave every new bridge unable to forward.
net.ipv4.conf.default.forwarding = 1
